# GitHub Pages: приложение «Акчам кайда?» без сервера (данные семьи вшиты в страницу).
# Включить один раз: Settings → Pages → Source: GitHub Actions. Дальше — на каждый push в main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты и сверка с эталонами
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Сборка страницы
        run: |
          python analyze.py --out site
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
