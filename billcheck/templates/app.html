<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Акчам кайда? Аудитор мобильных расходов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214;--bg2:#16171A;--panel:#1A1B1E;--panel2:#212327;--line:rgba(205,207,210,.13);--line2:rgba(205,207,210,.22);
  --text:#ECECEA;--muted:#A0A3A7;--dim:#6E7176;
  --mint:#86C5A0;--mint-d:#5FAE82;--hot:#E5795C;--hot-d:#D2603F;
  --night:#A79BC9;--sub:#C98FA7;--dup:#86A6C6;--intl:#CF9C6B;--spike:#D6B870;
  --paper:#F6F2E8;--ink:#17191C;--marker:rgba(229,121,92,.42);--pen:#D2361B;
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:20px;--r-md:14px;--r-sm:10px;--h-btn:44px;--h-btn-sm:34px;--h-pill:38px;--top-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--mint)}a:hover{color:#B3DBC3}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:8px}

/* ---------- top */
.top{position:sticky;top:0;z-index:30;background:rgba(17,18,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:var(--top-h);flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:11px;background:none;border:0;cursor:pointer;padding:0;text-align:left;color:var(--text);flex:none;min-width:0;border-radius:var(--r-sm)}
.logo svg{width:36px;height:36px;flex:none}
.logo b{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.15;white-space:nowrap}
.logo small{font-size:12px;color:var(--muted);white-space:nowrap;display:block}
.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;min-width:0}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--h-pill);padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;font-weight:700;font-size:13.5px;color:var(--text);text-decoration:none;white-space:nowrap;flex:none;transition:background .15s,border-color .15s,transform .1s}
.pill svg{flex:none}
.pill:hover{background:rgba(255,255,255,.08);border-color:rgba(205,207,210,.34)}
.pill:active{transform:scale(.97)}
.pill[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.pill.cta{background:var(--mint);border-color:var(--mint);color:#102A1D;padding:0 16px}
.pill.cta:hover{background:#B3DBC3;border-color:#B3DBC3}
.pill.lang{padding:0 11px;gap:4px;font-family:var(--mono);font-size:12.5px}
.offline{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.04em;color:var(--muted);padding:0 6px;white-space:nowrap;flex:none}
.offline::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spike);opacity:.8}
.offline[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h-btn);padding:0 20px;border-radius:var(--r-md);border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:800;font-size:14px;line-height:1.2;color:var(--text);text-decoration:none;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{background:#2A2C31;transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#102A1D;box-shadow:none}
.btn.mint:hover{background:#B3DBC3}
.btn.hot{background:var(--hot);border-color:var(--hot);color:#2B110A;box-shadow:none}
.btn.hot:hover{background:#EC957D}
.btn.sm{min-height:var(--h-btn-sm);padding:0 13px;font-size:13px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.mcard:focus-visible,.case:focus-visible{outline-offset:2px;border-radius:var(--r)}
.cal .d:focus-visible{outline-offset:1px;border-radius:var(--r-sm)}

/* ---------- panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.eyebrow{font:600 13px/1.2 var(--font);letter-spacing:0;color:var(--mint)}
.h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.h3{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:0;font-size:15px;max-width:640px}
.rc-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;max-width:none;font-size:14px}
.rc-legend span{display:inline-flex;align-items:center;gap:8px}
.rc-legend i{width:10px;height:10px;border-radius:50%;flex:none}
section.block{padding-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:20px;align-items:start}

/* ---------- hero */
.hero{padding:clamp(20px,4.5vh,64px) 0 clamp(16px,3vh,40px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:clamp(32px,4vw,64px);align-items:center}
.hero-eyebrow{font:600 12px/1.3 var(--mono);letter-spacing:.06em;color:var(--muted)}
.hero-eyebrow b{color:var(--mint);font-weight:700}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,min(2.7vw,4.6vh),46px);line-height:1.1;letter-spacing:-.03em;margin:clamp(10px,1.8vh,18px) 0 clamp(4px,1vh,10px);max-width:15em;text-wrap:balance}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(52px,min(6.6vw,11.5vh),116px);line-height:1;letter-spacing:-.045em;color:var(--mint);text-shadow:none;white-space:nowrap}
.bignum small{font-size:.36em;letter-spacing:-.01em;margin-left:.3em;color:#B3DBC3}
.hero .lead{font-size:clamp(15px,1.15vw,17px);line-height:1.55;color:#C2C3C0;max-width:34em;margin:clamp(10px,1.8vh,18px) 0 0;text-wrap:pretty}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,auto));justify-content:start;gap:0;margin-top:clamp(18px,3vh,30px);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:rgba(255,255,255,.015);max-width:100%}
.hstats>div{padding:12px 18px;border-left:1px solid var(--line);min-width:0}
.hstats>div:first-child{border-left:0}
.hstats b{display:block;font-family:var(--display);font-size:clamp(18px,1.6vw,22px);font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.hstats span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.hstats .save{background:rgba(134,197,160,.08)}
.hstats .save b{color:var(--mint)}
.hstats .save span{color:#B3DBC3}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:clamp(16px,2.6vh,26px)}
.hero-copy{container-type:inline-size;min-width:0}
@container (max-width:640px){.hstats{grid-template-columns:repeat(3,minmax(0,1fr))}.hstats span{white-space:normal;line-height:1.3}.hstats .save{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}

/* ---------- receipt (signature) */
.receipt{position:relative;background:var(--paper);color:var(--ink);font:12.5px/1.75 var(--mono);padding:26px 26px 40px;border-radius:6px 6px 0 0;box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.05);transform:rotate(1.4deg)}
.hero-rc-wrap .receipt{font-size:12px;line-height:1.62;padding:20px 22px 34px}
.hero-rc-wrap .rc-note{font-size:20px;margin:0 2px 2px 0}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 7px) 0 0/14px 14px repeat-x,linear-gradient(45deg,transparent 7px,var(--paper) 7px) 0 0/14px 14px repeat-x}
.receipt.flat{transform:none;box-shadow:none;border-radius:12px;padding:16px 18px 18px;font-size:12px}
.receipt.flat::after{display:none}
.rc-head{text-align:center;font-weight:700;letter-spacing:.12em}
.rc-sub{text-align:center;color:#5B5B5B;font-size:11.5px}
.rc-sep{border-top:1.5px dashed #9A958A;margin:10px 0}
.rc-row{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:10px;align-items:center;position:relative;padding:0 4px;margin:0 -4px}
.rc-row>*{min-width:0}
.rc-row .d{color:#6A665E;white-space:nowrap}
.rc-row .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:1.75em;max-height:1lh}
.rc-row .c{text-align:right;font-weight:700;white-space:nowrap}
.rc-row.hit{background:linear-gradient(100deg,transparent 0 1%,var(--marker) 2% 97%,transparent 99%);border-radius:3px}
.rc-row.hit .c{color:#B42318}
.rc-note{text-align:right;font:700 22px/1 var(--hand);color:var(--pen);transform:rotate(-3deg);margin:1px 2px 4px 0;white-space:nowrap}
.receipt.flat .rc-note{font-size:20px}
.rc-total{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.stamp{position:absolute;right:26px;bottom:-26px;z-index:3;border:3px solid var(--pen);color:var(--pen);font:800 15px/1.1 var(--display);letter-spacing:.06em;padding:8px 12px;border-radius:8px;transform:rotate(-12deg);opacity:.85;text-align:center;background:rgba(246,242,232,.6)}
.stamp small{display:block;font:700 10px/1.3 var(--mono);letter-spacing:.1em}
.hero-rc-wrap{position:relative;padding:12px 6px 24px;width:100%;max-width:540px;justify-self:center}
.rc-who{color:#5B5B5B;font-size:11px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-rc-wrap .tape{position:absolute;top:-2px;left:50%;width:120px;height:28px;background:rgba(255,255,255,.18);transform:translateX(-50%) rotate(-3deg);z-index:2;backdrop-filter:blur(2px);border-radius:3px}

/* ---------- members */
.mcard{position:relative;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;width:100%;padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);transition:transform .18s,border-color .18s,box-shadow .18s;color:var(--text)}
.mcard:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 24px 50px -24px rgba(0,0,0,.9)}
.mcard:active{transform:translateY(-1px) scale(.99)}
.mcard .row{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 16px var(--display);color:#141518;flex:none}
.mname{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15}
.mrole{font-size:13px;color:var(--muted)}
.mmoney{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.mmoney b{font-family:var(--display);font-size:22px;color:var(--hot);letter-spacing:-.02em;font-weight:700}
.mmoney span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px 3px 7px;border:1px solid}
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap .g{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800}

/* ---------- matrix */
.matrix{width:100%;border-collapse:separate;border-spacing:0 6px}
.matrix th{font:600 12.5px var(--font);letter-spacing:0;color:var(--muted);padding:6px 10px;text-align:center}
.matrix th:first-child{text-align:left}
.matrix td{background:var(--panel2);padding:12px 10px;text-align:center}
.matrix td:first-child{border-radius:14px 0 0 14px;text-align:left}
.matrix td:last-child{border-radius:0 14px 14px 0}
.mx-dot{display:inline-grid;place-items:center;border-radius:50%;font:700 11px var(--mono);color:#141518}
.mx-none{color:var(--dim)}
.scroll-x{overflow-x:auto}

/* ---------- rules */
.rule{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.rule .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.rule .cnt{position:absolute;right:18px;top:14px;font:800 44px/1 var(--display);opacity:.12}
.rule p{margin:0;font-size:13.5px;color:var(--muted)}
.rule .k{font:700 11.5px var(--mono);letter-spacing:.04em}

/* ---------- drop */
.drop{position:relative;border-radius:var(--r);padding:44px 28px;text-align:center;background:var(--panel);border:1.5px dashed var(--line2);transition:.18s}
.drop.over{border-color:var(--mint);background:rgba(134,197,160,.07);transform:scale(1.01)}
.drop h3{font-family:var(--display);font-size:22px;margin:16px 0 6px;letter-spacing:-.02em}
.drop p{margin:0 auto;color:var(--muted);max-width:560px}
.file-types{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.file-types span{font:700 12px var(--mono);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;color:var(--muted)}

/* ---------- member page */
.mhero{padding:28px 0 8px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0}
.back:hover{color:var(--text)}
.mhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.mhead h1{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.05}
.verdict{display:flex;align-items:center;gap:20px;padding:18px 22px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.verdict .t{font-family:var(--display);font-weight:700;font-size:18px}
.verdict .s{font-size:13px;color:var(--muted);max-width:220px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:24px}
.kpi{padding:18px 20px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.kpi .l{font:600 12.5px var(--font);letter-spacing:0;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.03em;margin-top:8px;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:6px}
.kpi.hot{background:rgba(229,121,92,.08);border-color:rgba(229,121,92,.35)}
.kpi.hot .v{color:var(--hot)}
.kpi.ok .v{color:var(--mint)}

/* cases */
.case{padding:22px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.case + .case{margin-top:14px}
.case::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.case-top{display:flex;align-items:flex-start;gap:14px}
.case .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.case .no{font:600 12.5px var(--font);letter-spacing:0;color:var(--muted)}
.case h3{font-family:var(--display);font-weight:700;font-size:18px;margin:4px 0 2px;letter-spacing:-.01em}
.case .when{font-size:13px;color:var(--muted)}
.case .amt{margin-left:auto;text-align:right;flex:none}
.case .amt b{display:block;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.case .amt span{font:600 12.5px var(--font);letter-spacing:0;color:var(--muted)}
.case p.ex{margin:14px 0 0;color:#D0D1CE}
.case p.adv{margin:10px 0 0;color:var(--mint);font-weight:700}
.case-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:4px}
.case-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);min-height:36px}
.toggle input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:#34363B;position:relative;cursor:pointer;transition:.15s;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked{background:var(--mint)}
.toggle input:checked::after{left:21px}
.ai{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(167,155,201,.1);border:1px solid rgba(167,155,201,.3);font-size:14px}
.ai b{color:var(--night)}
.evid-label{font:600 12.5px var(--font);letter-spacing:0;color:var(--muted);margin:0 0 8px}

/* aside */
.aside{position:sticky;top:calc(var(--top-h) + 20px);display:flex;flex-direction:column;gap:16px}
.claim-total{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.03em;color:var(--hot);line-height:1;margin:10px 0 6px}
.claim-list{list-style:none;margin:14px 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.claim-list li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.claim-list li.off{opacity:.38;text-decoration:line-through}

/* charts */
svg text{font-family:var(--mono)}
.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.lg span{display:inline-flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font:700 10px var(--mono);color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;padding:5px;font-size:10.5px;display:flex;flex-direction:column;justify-content:space-between;position:relative;border:1px solid rgba(255,255,255,.04)}
.cal .d b{font:700 11px var(--mono)}
.cal .d.flag{box-shadow:0 0 0 2px var(--spike)}
.cal .d .mk{position:absolute;top:5px;right:5px;display:flex;gap:2px}
.cal .d .mk i{width:6px;height:6px;border-radius:50%}
.hbar{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr) 84px;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.hbar .t{height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:4px}
.hbar b{text-align:right;font-family:var(--mono);font-size:13px}
.tag{font:700 10px var(--mono);border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:.04em}
.donut-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:22px;align-items:center}

/* letter */
.letter-wrap{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.6fr);gap:24px;align-items:start}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:30px 34px 78px;box-shadow:0 30px 60px -30px rgba(0,0,0,.85);position:relative}
.paper textarea{width:100%;min-height:440px;border:0;background:transparent;resize:vertical;color:var(--ink);font:13px/1.75 var(--mono);outline:none}
.paper .sig{position:absolute;right:40px;bottom:22px;font:700 30px var(--hand);color:#1D3FAF;transform:rotate(-6deg);opacity:.85}
.field{display:flex;flex-direction:column;gap:7px;font:600 12.5px var(--font);letter-spacing:0;color:var(--muted)}
.field input{border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 14px;min-height:46px;background:var(--panel2);font:600 15px var(--font);color:var(--text);letter-spacing:0;text-transform:none}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font:600 12.5px var(--font);letter-spacing:0;color:var(--muted);padding:8px;border-bottom:1px solid var(--line2)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t code{font:12px var(--mono);color:#D0D1CE;word-break:break-all}
.ok{color:var(--mint);font-weight:800}.bad{color:var(--hot);font-weight:800}
.score{display:inline-flex;align-items:center;gap:8px;font-weight:800;border-radius:999px;padding:6px 12px;font-size:14px;background:rgba(134,197,160,.12);color:var(--mint);border:1px solid rgba(134,197,160,.35)}

/* scan overlay */
.scan{position:fixed;inset:0;z-index:100;background:rgba(17,18,20,.97);display:none;place-items:center;padding:24px}
.scan.on{display:grid;animation:fade .2s}
.scan-box{width:min(760px,100%)}
.scan-title{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:12px 0 22px}
.scan-feed{height:210px;overflow:hidden;position:relative;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);padding:14px 18px;font:12.5px/1.75 var(--mono);color:#8C8F93;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.scan-feed .hit{color:var(--hot);font-weight:700}
.scan-beam{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--mint);box-shadow:none}
.scan-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.scan-stats div{padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.scan-stats b{display:block;font-family:var(--display);font-size:26px;letter-spacing:-.02em}
.scan-stats span{font-size:12px;color:var(--muted)}
.scan-rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.scan-rules span{font:700 12px var(--mono);padding:6px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);transition:.2s}
.scan-rules span.done{color:#102A1D;background:var(--mint);border-color:var(--mint)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .12s linear}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}

/* drawer, tip, toast */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg2);border-left:1px solid var(--line2);z-index:61;padding:28px;overflow:auto;transform:translateX(100%);transition:transform .22s}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.range{display:grid;grid-template-columns:1fr 64px;gap:12px;align-items:center}
.range input{accent-color:var(--mint)}
.range output{font:700 15px var(--mono);color:var(--text);text-align:right}
.tip{position:fixed;pointer-events:none;background:#F6F2E8;color:#17191C;font:600 12px/1.45 var(--font);padding:8px 11px;border-radius:9px;z-index:90;max-width:300px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:13px 20px;border-radius:14px;font-weight:800;z-index:95;display:none;box-shadow:0 20px 40px rgba(0,0,0,.5)}
footer{padding:64px 0 48px;color:var(--dim);font-size:13px}
.loading{padding:120px 0;text-align:center;color:var(--muted)}

/* ---------- M9 тариф */
.tariff{background:var(--panel);border-color:rgba(134,197,160,.32)}
.tf-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
.tf-compare{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.tf-col{padding:16px 18px;border-radius:var(--r-md);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tf-col.good{background:rgba(134,197,160,.1);border-color:rgba(134,197,160,.35)}
.tf-col .l{font:600 12.5px var(--font);letter-spacing:0;color:var(--muted)}
.tf-col .v{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin-top:6px}
.tf-col.good .v{color:var(--mint)}
.tf-col .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.tf-arrow{align-self:center;color:var(--muted);font-size:22px}
.tf-save{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.03em;color:var(--mint);line-height:1;margin-top:22px}
.tf-save small{font-size:.42em;margin-left:8px;color:#B3DBC3}
.tf-year{margin-top:8px;color:var(--text);font-weight:700}
.tf-opt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 96px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.tf-opt .t{height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.tf-opt .t i{display:block;height:100%;border-radius:4px;background:#3F4247}
.tf-opt.best{font-weight:800;color:var(--mint)}
.tf-opt.best .t i{background:var(--mint)}
.tf-opt b{text-align:right;font-family:var(--mono);font-size:13px}
.tf-opt.now .t i{background:var(--hot)}
.tf-note{font-size:12.5px;color:var(--muted);margin:16px 0 0}
body.simple .tf-grid,body.simple .tf-compare{grid-template-columns:minmax(0,1fr)}
body.simple .tf-arrow{display:none}
@media (max-width:760px){.tf-grid,.tf-compare{grid-template-columns:minmax(0,1fr)}.tf-arrow{display:none}.tf-save{font-size:34px}}

/* ---------- день → строки, радар */
.daymodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(640px,calc(100% - 32px));max-height:86vh;overflow:auto;z-index:62;opacity:0;pointer-events:none;transition:.18s}
.daymodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.daymodal .receipt{transform:none}
.radar-score{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:8px;align-items:center}
.radar-score i{display:block;height:8px;border-radius:4px}
.heat{display:grid;grid-template-columns:72px repeat(24,minmax(0,1fr));gap:3px;font:11px var(--mono)}
.heat .c{aspect-ratio:1;border-radius:4px}
.heat .lab{color:var(--muted);display:flex;align-items:center}
.heat .hh{color:var(--dim);text-align:center;font-size:9.5px}
.dots{display:flex;gap:3px}
.dots i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font:700 9px var(--display);color:#141518;font-style:normal}

/* ---------- режим для родителей: светлый, крупный, только суть */
body.simple{--bg:#F1F1EE;--bg2:#fff;--panel:#FFFFFF;--panel2:#F1F1EE;--line:rgba(23,25,28,.1);--line2:rgba(23,25,28,.18);--text:#17191C;--muted:#55585D;--dim:#62656A;--mint:#245E40;--hot:#B24A2E;--spike:#86622A;--night:#56487F;--sub:#8A4562;font-size:20px;background:#F1F1EE}
body.simple .top{background:rgba(241,241,238,.9)}
body.simple .hero .lead{color:#33353A}
body.simple .bignum small,body.simple .tf-save small,body.simple .hstats .save span{color:var(--mint)}
body.simple .hstats span{font-size:14.5px;color:var(--muted);white-space:normal;line-height:1.3}
body.simple .hstats{grid-template-columns:repeat(3,minmax(0,1fr))}
body.simple .hstats .save{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
body.simple .hstats .save{background:rgba(36,94,64,.08)}
body.simple .hero-eyebrow{font-size:14px}
body.simple .kpi .l,body.simple .tf-col .l,body.simple .case .no,body.simple .case .amt span{font-size:13px}
body.simple .kpi .s,body.simple .tf-col .s,body.simple .tf-note,body.simple .mrole,body.simple .mmoney span{font-size:15px}
body.simple .btn:hover{background:#E9E4D8}
body.simple .btn.mint:hover,body.simple .pill.cta:hover{background:#245E40;border-color:#245E40}
body.simple .btn.hot{color:#fff}
body.simple .btn.hot:hover{background:#8B3B24}
body.simple .pill:hover{background:rgba(23,25,28,.06)}
body.simple .chip{filter:brightness(.62) saturate(1.3)}
body.simple .scan{background:rgba(241,241,238,.97)}
body.simple .scan-feed{color:#55585D}
body.simple .offline::before{background:#86622A}
body.simple .rc-legend i{filter:brightness(.8)}
body.simple a:hover{color:#245E40}
body.simple .tech{display:none!important}
body.simple .split,body.simple .case-body{grid-template-columns:minmax(0,1fr)}
body.simple .case p.ex{color:#17191C;font-size:20px}
body.simple .case h3{font-size:24px}
body.simple .bignum{text-shadow:none}
body.simple .btn.mint,body.simple .pill.cta{color:#fff}
body.simple .kpi.hot{background:#F7ECE7}
body.simple .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
body.simple .pill[aria-pressed="true"]{background:#17191C;color:#fff;border-color:#17191C}
body.simple .verdict .t,body.simple .mcard div[style*="font-weight:800"]{filter:brightness(.72)}
.simple-only{display:none}
body.simple .simple-only{display:block}

/* шапка: одна строка; на узких экранах подписи прячутся, остаются иконки */
@media (max-width:1439px){.logo small{display:none}}
@media (max-width:1279px){.top .pl{display:none}.top .pill:not(.cta):not(.lang){width:var(--h-pill);padding:0}}

  .hero h1{font-size:28px}.bignum{font-size:clamp(44px,13vw,60px)}}

  .top .wrap{gap:8px}.top nav{gap:4px}.logo b{font-size:14px}.pill.lang{padding:0 8px}.top{--h-pill:36px}
  .hstats>div{padding:10px 12px}.hero-actions .btn{flex:1 1 auto}.hero-rc-wrap .receipt{padding:18px 16px 30px}}
@media (max-width:400px){.logo b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function api(path,body){

/* ---------- M4 светофор (по ТЗ команды): красный — подписка, ночной контент или межд. звонок;
   жёлтый — только всплеск или дубль; зелёный — аномалий нет */
function light(r){
  const k=new Set(r.anomalies.map(a=>a.anomaly_type));
  if(["new_subscription","night_charge","international_rate"].some(x=>k.has(x))) return {lvl:2,color:"#D9644F",label:t("Опасные списания","Коркунучтуу төлөмдөр"),hint:t("подписка, ночной контент или дорогой звонок","жазылуу, түнкү контент же кымбат чалуу")};
  if(k.size) return {lvl:1,color:"#D6B870",label:t("Проверьте","Текшериңиз"),hint:t("только всплеск трат или дубль","чыгым секириги же дубль гана")};
  return {lvl:0,color:"#86C5A0",label:t("Чисто","Таза"),hint:t("подозрительных списаний нет","шектүү төлөмдөр жок")};
}
function ring(r,size=64){
  const L=light(r), h=size, w=Math.round(size*0.46), rad=w*0.32, cols=["#D9644F","#D6B870","#86C5A0"], on=[2,1,0].indexOf(L.lvl);
  let g=`<rect x="1" y="1" width="${w-2}" height="${h-2}" rx="${w/2.4}" fill="#141518" stroke="rgba(205,207,210,.25)"/>`;
  cols.forEach((c,i)=>{ const cy=h*(0.2+0.3*i), act=i===on; g+=`<circle cx="${w/2}" cy="${cy}" r="${rad}" fill="${act?c:c+"22"}" ${act?``:""}/>`; });
  return `<span class="ring-wrap" style="width:${w}px;height:${h}px" data-tip="${esc(t("Светофор","Светофор")+": "+L.label+" ("+L.hint+")")}" role="img" aria-label="${esc(L.label)}">
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><filter id="lg${size}" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${g}</svg></span>`;
}

/* ---------- сканер (вау-момент на демо) */
let scanSkip=false;
async function runScan(title, members, ms){
  scanSkip=false;
  const el=$("#scan"), feed=$("#scanFeed"); $("#scanTitle").innerHTML=title; el.classList.add("on");
  const rows=[]; members.forEach(m=>m.report.anomalies.forEach(a=>(a.context||[]).forEach(c=>rows.push(c))));
  const lines=members.reduce((s,m)=>s+m.report.valid_rows+m.report.dropped_rows,0), drop=members.reduce((s,m)=>s+m.report.dropped_rows,0), an=members.reduce((s,m)=>s+m.report.anomalies.length,0);
  const kinds=Object.keys(TYPES); $("#scRules").innerHTML=kinds.map(k=>`<span data-k="${k}">${t(RULE_TEXT[k][0],KY_TYPES[k][0])}</span>`).join("");
  const t0=performance.now(); let i=0;
  while(!scanSkip){
    const p=Math.min(1,(performance.now()-t0)/ms), e=1-Math.pow(1-p,2);
    $("#scLines").textContent=Math.round(lines*e).toLocaleString("ru-RU"); $("#scDrop").textContent=Math.round(drop*e); $("#scAnom").textContent=Math.round(an*Math.max(0,(p-.25)/.75));
    $("#scBar").style.width=(p*100)+"%";
    kinds.forEach((k,j)=>{ if(p>0.18+j*0.15) document.querySelector(`#scRules [data-k="${k}"]`)?.classList.add("done"); });
    if(rows.length){ const r=rows[i++%rows.length]; const div=document.createElement("div"); if(r.hit) div.className="hit";
      div.textContent=`${r.datetime}  ${(TYPE_RU[r.type]||r.type).padEnd(9)} ${(r.number||"·").padEnd(15)} ${fmt(r.cost_som).padStart(8)}${r.hit?"   ← подозрительно":""}`;
      feed.appendChild(div); if(feed.children.length>14) feed.firstChild.remove(); }
    if(p>=1) break; await sleep(70);
  }
  await sleep(scanSkip?0:350); el.classList.remove("on"); feed.innerHTML="";
}

function spark(r,w=200,h=40){
  const v=Object.values(r.by_day); if(!v.length) return ""; const max=Math.max(...v)||1, step=w/(v.length-1||1);
  const spikes=new Set(r.anomalies.filter(a=>a.anomaly_type==="day_spike").map(a=>a.datetime.slice(0,10)));
  const keys=Object.keys(r.by_day); const pts=v.map((x,i)=>`${(i*step).toFixed(1)},${(h-3-(h-8)*x/max).toFixed(1)}`);
  let g=`<polyline points="0,${h} ${pts.join(" ")} ${w},${h}" fill="rgba(134,197,160,.10)" stroke="none"/><polyline points="${pts.join(" ")}" fill="none" stroke="#86C5A0" stroke-width="1.6" stroke-linejoin="round"/>`;
  keys.forEach((k,i)=>{ if(spikes.has(k)) g+=`<circle cx="${(i*step).toFixed(1)}" cy="${(h-3-(h-8)*v[i]/max).toFixed(1)}" r="4" fill="#D6B870" stroke="#1A1B1E" stroke-width="2"/>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">${g}</svg>`;
}

function tariffBlock(r){
  const T=r.tariff; if(!T) return "";
  const max=Math.max(T.paid_som,...T.options.map(o=>o.som))||1;
  const opt=(name,v,cls)=>`<div class="tf-opt ${cls}"><span>${esc(name)}</span><span class="t"><i style="width:${(100*v/max).toFixed(1)}%"></i></span><b class="num">${fmt(v)}</b></div>`;
  return `<section class="block" id="tariff" style="padding-top:28px"><div class="panel tariff">

/* ---------- графики */
function dayChart(r){
  const days=Object.entries(r.by_day); if(!days.length) return "";
  const W=1100,H=300,L=46,R=10,TP=28,B=34,w=S.settings.z_window_days||7,zt=S.settings.z_threshold, vals=days.map(d=>d[1]);
  const mean=[],thr=[]; vals.forEach((v,i)=>{ if(i<w){mean.push(null);thr.push(null);return;} const win=vals.slice(i-w,i),mu=win.reduce((a,b)=>a+b,0)/w,sd=Math.sqrt(win.reduce((a,b)=>a+(b-mu)**2,0)/w); mean.push(mu); thr.push(mu+zt*sd); });
  const vmax=Math.max(...vals)*1.12||1, bw=(W-L-R)/days.length, y=v=>TP+(H-TP-B)*(1-Math.min(v,vmax)/vmax);
  const flags={}; r.anomalies.forEach(a=>{(flags[a.datetime.slice(0,10)] ||= []).push(a);});
  let g=`<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C4F55"/><stop offset="1" stop-color="#2E3035"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6D5A3"/><stop offset="1" stop-color="#A88A4C"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
  const step=vmax>300?100:vmax>120?50:vmax>60?20:10;
  for(let v=0;v<=vmax;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(205,207,210,.1)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6E7176">${v}</text>`;
  days.forEach(([d,v],i)=>{
    const x=L+i*bw+bw*.16, bwi=bw*.68, f=flags[d]||[], spike=f.some(a=>a.anomaly_type==="day_spike");
    const tip=`${dt(d).label}: ${som(v)}`+(mean[i]!=null?` · норма ${som(mean[i])}`:"")+f.map(a=>` · ${TYPES[a.anomaly_type].short}`).join("");
    if(spike) g+=`<rect x="${x-4}" y="${y(v)}" width="${bwi+8}" height="${H-B-y(v)}" rx="6" fill="#D6B870" opacity=".45" />`;
    g+=`<rect x="${x-bw*.16}" y="${TP}" width="${bw}" height="${H-B-TP}" fill="transparent" data-day="${d}" style="cursor:pointer"/>`;
    g+=`<rect x="${x}" y="${y(v)}" width="${bwi}" height="${Math.max(H-B-y(v),1)}" rx="4" fill="url(#${spike?"gs":"gb"})" data-tip="${esc(tip)}" data-day="${d}" style="cursor:pointer"/>`;
    f.filter(a=>a.anomaly_type!=="day_spike").forEach((a,k)=>{ g+=`<circle cx="${x+bwi/2}" cy="${y(v)-10-k*14}" r="5.5" fill="${TYPES[a.anomaly_type].hex}" stroke="#1A1B1E" stroke-width="2" data-tip="${esc(TYPES[a.anomaly_type].t+": "+som(a.amount_som))}"/>`; });
    if(spike){ const a=f.find(a=>a.anomaly_type==="day_spike"); g+=`<text x="${x+bwi/2}" y="${y(v)-10}" text-anchor="middle" font-size="13" font-weight="700" fill="#D6B870">${fmt(v,0)} · ×${(a.evidence.day_total/(a.evidence.mean_7d||1)).toFixed(1)}</text>`; }
    if(i%3===0||i===days.length-1) g+=`<text x="${x+bwi/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6E7176">${Number(d.slice(8))}</text>`;
  });
  const path=arr=>arr.map((v,i)=>v==null?null:`${(L+i*bw+bw/2).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");
  g+=`<polyline points="${path(mean)}" fill="none" stroke="#86C5A0" stroke-width="2.2" stroke-linejoin="round"/>`;
  g+=`<polyline points="${path(thr)}" fill="none" stroke="#E5795C" stroke-width="2" stroke-dasharray="7 6" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Траты по дням с отмеченными аномалиями">${g}</svg>`;
}
function calendar(r){
  const days=Object.entries(r.by_day); if(!days.length) return "";
  const first=new Date(days[0][0]+"T00:00:00"), lead=(first.getDay()+6)%7, vmax=Math.max(...days.map(d=>d[1]));
  const flags={}; r.anomalies.forEach(a=>{(flags[a.datetime.slice(0,10)] ||= []).push(a.anomaly_type);});
  let h=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="h">${x}</div>`).join(""); for(let i=0;i<lead;i++) h+="<div></div>";
  days.forEach(([d,v])=>{ const k=Math.pow(v/vmax,.55), f=flags[d]||[];
    h+=`<div class="d ${f.includes("day_spike")?"flag":""}" data-day="${d}" role="button" tabindex="0" style="cursor:pointer;background:rgba(134,197,160,${(0.05+0.6*k).toFixed(2)});color:${k>.7?"#102A1D":"var(--text)"}" data-tip="${esc(dt(d).label+": "+som(v)+(f.length?" · "+f.map(t=>TYPES[t].short).join(", "):""))}"><b>${Number(d.slice(8))}</b><span class="num" style="font-size:10px;opacity:.85">${fmt(v,0)}</span>${f.length?`<span class="mk">${f.filter(t=>t!=="day_spike").map(t=>`<i style="background:${TYPES[t].hex}"></i>`).join("")}</span>`:""}</div>`; });
  return `<div class="cal">${h}</div>`;
}
function clock(r){
  const S0=300,c=S0/2,r0=58,r1=128,v=r.by_hour,vmax=Math.max(...v)||1,ns=S.settings.night_start_hour,ne=S.settings.night_end_hour;
  const pt=(ang,rad)=>[c+rad*Math.sin(ang),c-rad*Math.cos(ang)];
  const arc=(a0,a1,ra,rb)=>{const [x0,y0]=pt(a0,rb),[x1,y1]=pt(a1,rb),[x2,y2]=pt(a1,ra),[x3,y3]=pt(a0,ra),lg=a1-a0>Math.PI?1:0;return `M${x0},${y0} A${rb},${rb} 0 ${lg} 1 ${x1},${y1} L${x2},${y2} A${ra},${ra} 0 ${lg} 0 ${x3},${y3}Z`;};
  let g=`<path d="${arc(ns/24*2*Math.PI,ne/24*2*Math.PI,r0-6,r1+8)}" fill="rgba(167,155,201,.14)"/>`;
  g+=`<circle cx="${c}" cy="${c}" r="${r0-8}" fill="none" stroke="rgba(205,207,210,.15)"/>`;
  v.forEach((x,i)=>{ const a0=i/24*2*Math.PI+.03,a1=(i+1)/24*2*Math.PI-.03, rb=r0+(r1-r0)*Math.sqrt(x/vmax), night=i>=ns&&i<ne;
    g+=`<path d="${arc(a0,a1,r0,Math.max(rb,r0+2))}" fill="${night?(x>0?"#A79BC9":"rgba(167,155,201,.25)"):"#86C5A0"}" opacity="${night?1:.35+.65*x/vmax}" data-tip="${esc(`${String(i).padStart(2,"0")}:00–${String(i+1).padStart(2,"0")}:00 · ${som(x)}`)}"/>`; });
  [0,6,12,18].forEach(hh=>{ const [x,y]=pt(hh/24*2*Math.PI,r1+20); g+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="#A0A3A7">${hh}:00</text>`; });
  const night=v.slice(ns,ne).reduce((a,b)=>a+b,0);
  g+=`<text x="${c}" y="${c-4}" text-anchor="middle" font-size="22" font-weight="700" fill="#A79BC9" style="font-family:'Golos Text',sans-serif">${fmt(night,0)}</text><text x="${c}" y="${c+16}" text-anchor="middle" font-size="10" fill="#A0A3A7">сом ночью</text>`;
  return `<svg viewBox="-10 -10 ${S0+20} ${S0+20}" role="img" aria-label="Траты по часам суток" style="width:100%;max-width:300px;display:block;margin:0 auto">${g}</svg>`;
}

    <div class="h3" style="margin:0 0 4px">${t("Рейтинг подозрительности","Шектүүлүк рейтинги")}</div><p class="muted" style="font-size:13px;margin:0 0 4px">${t("Балл = доля абонентов + доля ночных списаний + доля новых подписок.","Балл = абоненттердин үлүшү + түнкү төлөмдөрдүн үлүшү + жаңы жазылуулардын үлүшү.")}</p>
    <p class="muted" style="font-size:13px;margin:0 0 14px">${t("Эвристика для экрана оператора. В anomalies.json не попадает, чтобы не дать ложных срабатываний.","Оператордун экраны үчүн эвристика. Жалган белгилерди бербөө үчүн anomalies.json'го кирбейт.")}</p>
    <table class="t"><thead><tr><th>${t("Номер","Номер")}</th><th>${t("Абоненты","Абоненттер")}</th><th>${t("Списаний","Төлөмдөр")}</th><th>${t("Сом","Сом")}</th><th>${t("Ночью","Түнкү")}</th><th>${t("Новая подписка","Жаңы жазылуу")}</th><th style="width:180px">${t("Балл","Балл")}</th></tr></thead><tbody>
    ${R.map(r=>`<tr><td class="mono" style="font-weight:700;font-size:15px">${esc(r.number)}<div class="muted" style="font-size:11px;font-weight:500">${r.types.map(x=>TYPE_RU[x]||x).join(", ")}</div></td>
      <td><div class="dots">${r.who.map(w=>`<i style="background:${colorOf(w)}" data-tip="${esc(w)}">${esc(initials(w))}</i>`).join("")}</div><span class="muted" style="font-size:12px">${r.subscribers} ${t("из","/")} ${n}</span></td>
      <td class="num mono">${r.charges}</td><td class="num mono">${fmt(r.total_som)}</td>
      <td class="num mono" style="color:${r.night_share?"var(--night)":"var(--dim)"}">${Math.round(r.night_share*100)}%</td>
      <td class="num mono" style="color:${r.new_subscription_share?"var(--sub)":"var(--dim)"}">${Math.round(r.new_subscription_share*100)}%</td>
      <td><div class="radar-score"><span style="background:rgba(255,255,255,.06);border-radius:4px"><i style="width:${r.score}%;background:${scoreColor(r.score)}"></i></span><b class="mono" style="color:${scoreColor(r.score)}">${r.score}</b></div></td></tr>`).join("")}
    </tbody></table></div></section>
  <section class="block" style="padding-top:20px"><div class="panel">
    <div class="h3" style="margin:0 0 4px">${t("Тепловая карта: час суток × короткий номер","Жылуулук картасы: саат × кыска номер")}</div>
    <p class="muted" style="font-size:13px;margin:0 0 16px">${t("Фиолетовые клетки: ночные списания. Их видно сразу.","Кызгылт көк уячалар: түнкү төлөмдөр. Дароо көрүнөт.")}</p>${heat}</div></section>
  </div><footer><div class="wrap">Акчам кайда? · ${t("радар оператора","оператордун радары")}</div></footer>`;
}
async function refreshRadar(){ if(!S.online) return; try{ S.radar=(await api("/api/radar",{members:S.members.map(m=>({name:m.name,report:m.report})),settings:S.settings})).radar; }catch(e){} }

/* ---------- M1: клик по дню → строки детализации этого дня */
function openDay(d){
  const m=member(S.memberId); if(!m) return; const r=m.report;
  const rows=(r.rows||[]).filter(x=>x[1].startsWith(d));
  const hits=new Set(); const notes={};
  r.anomalies.forEach(a=>{ const h=(a.context||[]).filter(c=>c.hit&&c.datetime.startsWith(d)); h.forEach(c=>hits.add(c.line)); if(h.length) notes[h[h.length-1].line]=noteFor(a); });
  const total=rows.reduce((s,x)=>s+x[6],0);
  const body=rows.map(x=>rcRow({line:x[0],datetime:x[1],type:x[2],number:x[3],duration_sec:x[4],mb:x[5],cost_som:x[6],hit:hits.has(x[0])},notes[x[0]]||"")).join("");
  $("#dayBody").innerHTML=`<div class="receipt"><div style="display:flex;justify-content:space-between;align-items:center"><div class="rc-head" style="text-align:left">${esc(m.name.toUpperCase())} · ${dt(d+" 00:00:00").label.toUpperCase()}</div><button class="btn sm" id="dayClose" style="background:#17191C;color:#F6F2E8" aria-label="Закрыть">✕</button></div>
    <div class="rc-sub" style="text-align:left">${rows.length} ${t("строк","сап")} · ${esc(r.meta.source)}</div><div class="rc-sep"></div>${body||t("Нет списаний","Төлөм жок")}<div class="rc-sep"></div>
    <div class="rc-total"><span>${t("ИТОГО ЗА ДЕНЬ","КҮНДҮН ЖЫЙЫНТЫГЫ")}</span><span class="num">${fmt(total)}</span></div></div>`;
  $("#dayModal").classList.add("open"); $("#dayBg").classList.add("open");
  $("#dayClose").onclick=closeDay;
}
function closeDay(){ $("#dayModal").classList.remove("open"); $("#dayBg").classList.remove("open"); }

/* ---------- живой дубль для жюри: копия звонка через 20 с → сканер ловит */
async function injectDuplicate(){
  const m=member(S.memberId); const calls=(m.report.rows||[]).filter(x=>x[2]==="call"&&x[3].startsWith("+996")&&x[1].slice(11,13)>="10"&&x[1].slice(11,13)<="20");
  const src=calls[Math.floor(calls.length/2)]||(m.report.rows||[]).find(x=>x[2]==="call"); if(!src){ toast(t("Нет звонков для копии","Көчүрүү үчүн чалуу жок")); return; }
  const d=new Date(src[1].replace(" ","T")); d.setSeconds(d.getSeconds()+20);
  const pad=v=>String(v).padStart(2,"0"), stamp=`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const line=`\n${stamp},call,${src[3]},${src[4]},0,"${String(src[6].toFixed(2)).replace(".",",")}"`;
  const before=m.report.anomalies.length;
  m.content=m.content.replace(/\s*$/,"")+line+"\n";
  const res=await api("/api/analyze",{filename:m.filename,content:m.content,settings:S.settings,expected:m.expected||undefined});
  await runScan(t(`Добавили строку <span class="mono" style="color:var(--hot)">${esc(stamp)} · ${esc(src[3])}</span> и сканируем заново`,`<span class="mono" style="color:var(--hot)">${esc(stamp)} · ${esc(src[3])}</span> сабын кошуп, кайра сканерлейбиз`),[{report:res.report}],1400);
  m.report=res.report; if(res.checks) m.checks=res.checks; S.included={}; await refreshRadar(); render();
  const dup=res.report.anomalies.find(a=>a.anomaly_type==="duplicate_charge"&&a.datetime.endsWith(stamp.slice(11)));
  toast(dup?t(`Сканер поймал дубль: ${som(dup.amount_som)} к возврату`,`Сканер дублду кармады: ${som(dup.amount_som)} кайтарууга`):t(`Находок: ${before} → ${res.report.anomalies.length}`,`Табылгалар: ${before} → ${res.report.anomalies.length}`));
}

/* ---------- письмо */
const TITLES={night_charge:"Ночное списание за платный контент/SMS",new_subscription:"Подписка, которую я не оформлял(а)",duplicate_charge:"Двойное списание",international_rate:"Завышенный тариф на международный звонок",day_spike:"Аномально высокие расходы за день"};
function letterText(m){
  const r=m.report, who=S.signer[m.id]?.name ?? m.name, phone=S.signer[m.id]?.phone ?? (m.msisdn||"[номер телефона]");
  const sel=r.anomalies.map((a,i)=>({a,inc:isIncluded(m,i)})), claims=sel.filter(x=>x.inc&&x.a.reclaimable).map(x=>x.a), spikes=sel.filter(x=>x.inc&&!x.a.reclaimable).map(x=>x.a);
  const p=r.meta.period, L=["В службу поддержки абонентов INAI Mobile",`от абонента ${who}, номер ${phone}`,"","ЗАЯВЛЕНИЕ","о перерасчёте и возврате ошибочно списанных средств","",
    `При проверке детализации моего номера за период ${p[0]} — ${p[1]} я обнаружил(а) списания, с которыми не согласен(на):`,""];
  claims.forEach((a,i)=>{ L.push(`${i+1}. ${a.datetime} — ${TITLES[a.anomaly_type]}${a.number?", номер "+a.number:""}: ${a.amount_som.toFixed(2)} сом.`); L.push(`   ${a.explanation}`); });
  L.push("",`Итого прошу вернуть на баланс: ${claims.reduce((s,a)=>s+a.amount_som,0).toFixed(2)} сом.`);
  const subs=[...new Set(claims.filter(a=>["new_subscription","night_charge"].includes(a.anomaly_type)&&a.number).map(a=>a.number))].sort();
  if(subs.length) L.push(`Также прошу отключить платные подписки и контент с коротких номеров ${subs.join(", ")} и установить запрет на их подключение без моего письменного согласия.`);
  if(spikes.length) L.push("",`Дополнительно прошу предоставить разъяснение по аномально высоким расходам за ${spikes.map(a=>a.datetime.slice(0,10)).join(", ")}.`);
  L.push("","Ответ прошу направить в установленный срок.","",`Дата: ${new Date().toLocaleDateString("ru-RU")}            Подпись: ____________`,"","Приложение: детализация расходов и отчёт «Акчам кайда?».");
  return L.join("\n");
}
function refreshClaim(){
  const m=member(S.memberId); if(!m) return;
  if($("#letterText")) $("#letterText").value=letterText(m);
  if($("#claimTotal")) $("#claimTotal").innerHTML=`${fmt(claimSum(m))} <span style="font-size:20px">сом</span>`;
  if($("#claimList")) $("#claimList").innerHTML=claimList(m);
  const sig=document.querySelector(".paper .sig"); if(sig) sig.textContent=(S.signer[m.id]?.name ?? m.name).split(" ")[0];
}

/* ---------- DOM-привязки */
function bindDom(){
  const tip=$("#tip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("mousemove",e=>{ tip.textContent=el.getAttribute("data-tip"); tip.style.display="block"; tip.style.left=Math.min(e.clientX+14,innerWidth-310)+"px"; tip.style.top=(e.clientY+16)+"px"; });
    el.addEventListener("mouseleave",()=>tip.style.display="none");
  });
  const drop=$("#drop");
  if(drop&&S.online){
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
    drop.addEventListener("drop",e=>handleFiles([...e.dataTransfer.files]));
  }
}

/* ---------- загрузка */
const readText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f,"utf-8");});
const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
async function handleFiles(files){
  if(!S.online){ toast("Запустите run.bat --serve, чтобы проверять свои файлы"); return; }
  const data=files.filter(f=>/\.(csv|pdf)$/i.test(f.name)), exps=files.filter(f=>/\.json$/i.test(f.name));
  if(!data.length){ toast("Нужен файл .csv или .pdf"); return; }
  const added=[];
  for(const f of data){
    try{
      const stem=f.name.replace(/\.(csv|pdf)$/i,""), ef=exps.find(e=>e.name.startsWith(stem))||(data.length===1&&exps.length===1?exps[0]:null);
      const body={filename:f.name,settings:S.settings};
      if(/\.pdf$/i.test(f.name)) body.content_b64=await readB64(f); else body.content=await readText(f);
      if(ef) body.expected=JSON.parse(await readText(ef));
      const res=await api("/api/analyze",body);
      added.push({id:"up-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),name:stem,role:/\.pdf$/i.test(f.name)?"PDF-детализация":"Загруженный файл",msisdn:"",report:res.report,checks:res.checks||[],content:body.content,content_b64:body.content_b64,expected:body.expected,filename:f.name,color:AVA[(S.members.length+added.length)%AVA.length]});
    }catch(e){ toast(`${f.name}: ${e.message}`); }
  }
  if(!added.length) return;
  await runScan(`Сканируем ${esc(added.map(a=>a.filename).join(", "))}`, added, 1500);
  S.members.push(...added); await refreshRadar(); const last=added[added.length-1];
  toast(`Найдено ${last.report.anomalies.length} · к возврату ${som(last.report.summary.reclaimable_som)}`); go("member",last.id);
}

/* ---------- пороги */
const SETTINGS_UI=[["night_end_hour","Ночь заканчивается в, ч",1,12,1],["intl_rate_limit","Норма международной минуты, сом",5,60,1],["z_threshold","Порог всплеска, z-score",1.5,5,0.1],["z_window_days","Окно сравнения, дней",3,14,1],["duplicate_window_sec","Окно поиска дублей, сек",10,300,5]];
function renderSettings(){
  $("#settingsForm").innerHTML=SETTINGS_UI.map(([k,l,mi,ma,st])=>`<label class="field">${l}<span class="range"><input type="range" min="${mi}" max="${ma}" step="${st}" value="${S.settings[k]}" data-set="${k}"><output>${S.settings[k]}</output></span></label>`).join("");
  $("#settingsNote").textContent=S.online?"Пересчёт делает тот же Python-движок, что проходит автопроверку.":"В демо-снимке без сервера пороги не меняются. Запустите run.bat --serve.";
  $("#applySettings").disabled=!S.online;
}
async function applySettings(){
  const btn=$("#applySettings"); btn.disabled=true; btn.textContent="Сканируем…";
  try{
    await Promise.all(S.members.map(async m=>{ const body={filename:m.filename||m.report.meta.source,settings:S.settings};
      if(m.content_b64) body.content_b64=m.content_b64; else body.content=m.content; if(m.expected) body.expected=m.expected;
      const res=await api("/api/analyze",body); m.report=res.report; if(res.checks) m.checks=res.checks; }));
    S.included={}; S.ai={}; await refreshRadar(); closeDrawer(); render();
    const n=S.members.reduce((a,m)=>a+m.report.anomalies.length,0); toast(`Пересканировано: ${n} ${plural(n,"находка","находки","находок")}`);
  }catch(e){ toast("Ошибка: "+e.message); }
  btn.disabled=false; btn.textContent="Пересканировать";
}
function openDrawer(){ renderSettings(); $("#drawer").classList.add("open"); $("#drawerBg").classList.add("open"); }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#drawerBg").classList.remove("open"); }

/* ---------- события */
document.addEventListener("click", async e=>{
  const g=e.target.closest("[data-go]"); if(g){ go("member",g.dataset.go); return; }
  const dd=e.target.closest("[data-day]"); if(dd&&S.view==="member"){ openDay(dd.dataset.day); return; }
  const ai=e.target.closest("[data-ai]");
  if(ai){ const k=ai.dataset.ai,[id,i]=k.split("|"); ai.disabled=true; ai.textContent="Думаю…";
    try{ S.ai[k]=await api("/api/explain",{anomaly:member(id).report.anomalies[+i],lang:S.lang}); }catch(err){ toast(err.message); }
    const y=scrollY; render(); scrollTo(0,y); return; }
  const act=e.target.closest("[data-act]")?.dataset.act; if(!act) return;
  const m=member(S.memberId);
  if(act==="home") go("family");
  if(act==="radar") go("radar");
  if(act==="inject"){ const b=e.target.closest("[data-act]"); b.disabled=true; try{ await injectDuplicate(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(act==="upload") $("#fileInput").click();
  if(act==="to-letter") $("#letter").scrollIntoView({behavior:"smooth"});
  if(act==="dl-anom") download(`${m.id}_anomalies.json`,JSON.stringify(m.report.anomalies.map(a=>({datetime:a.datetime,type:a.type,anomaly_type:a.anomaly_type,amount_som:a.amount_som,reason:a.reason,explanation:a.explanation,advice:a.advice,number:a.number})),null,2));
  if(act==="dl-result") download(`${m.id}_result.json`,JSON.stringify(expectedFormat(m.report),null,2));
  if(act==="copy-letter"){ try{ await navigator.clipboard.writeText($("#letterText").value); }catch{ $("#letterText").select(); document.execCommand("copy"); } toast(t("Письмо скопировано. Вставьте его в чат поддержки","Кат көчүрүлдү. Колдоо чатына коюңуз")); }
  if(act==="dl-letter") download(`pretenziya_${m.id}.txt`,$("#letterText").value,"text/plain;charset=utf-8");
  if(act==="print-letter"){ const w=window.open("","_blank"); if(!w){ download(`pretenziya_${m.id}.txt`,$("#letterText").value,"text/plain;charset=utf-8"); return; }
    w.document.write(`<html><head><title>Претензия</title><style>body{font:14px/1.7 Georgia,serif;max-width:720px;margin:48px auto;white-space:pre-wrap}</style></head><body>${esc($("#letterText").value)}</body></html>`); w.document.close(); w.print(); }
  if(act==="report-html"){ if(S.online){ const html=await api("/api/render",{report:m.report,complaint:$("#letterText").value}); download(`${m.id}_report.html`,html,"text/html;charset=utf-8"); } else toast("HTML-отчёт формирует сервер: run.bat --serve"); }
});
document.addEventListener("change",e=>{ if(e.target.matches("[data-inc]")){ S.included[e.target.dataset.inc]=e.target.checked; refreshClaim(); } });
document.addEventListener("input",e=>{
  if(e.target.id==="sgName"||e.target.id==="sgPhone"){ S.signer[S.memberId]={name:$("#sgName").value,phone:$("#sgPhone").value}; refreshClaim(); }
  if(e.target.matches("[data-set]")){ S.settings[e.target.dataset.set]=Number(e.target.value); e.target.nextElementSibling.textContent=e.target.value; }
});
$("#home").onclick=()=>go("family");
$("#btnUpload").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{ handleFiles([...e.target.files]); e.target.value=""; };
$("#btnSettings").onclick=openDrawer; $("#drawerClose").onclick=closeDrawer; $("#drawerBg").onclick=closeDrawer;
$("#applySettings").onclick=applySettings; $("#resetSettings").onclick=()=>{ S.settings={...DEFAULTS}; renderSettings(); };
$("#scanSkip").onclick=()=>{ scanSkip=true; };
$("#btnSimple").onclick=e=>{ S.simple=!S.simple; document.body.classList.toggle("simple",S.simple); e.currentTarget.setAttribute("aria-pressed",S.simple); render(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeDrawer(); closeDay(); scanSkip=true; }
  if(e.key==="Enter"&&e.target.matches("[data-day]")) openDay(e.target.dataset.day); });
$("#dayBg").onclick=closeDay;
$("#btnRadar").onclick=()=>go("radar");
$("#btnLang").onclick=()=>{ S.lang=S.lang==="ru"?"ky":"ru"; try{localStorage.setItem("akcham-lang",S.lang);}catch(e){} render(); };
try{ const l=localStorage.getItem("akcham-lang"); if(l==="ky"||l==="ru") S.lang=l; }catch(e){}

boot();
</script>
</body>
</html>
